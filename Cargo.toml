[package]
name = "elevenlabs-rust-sdk"
version = "1.0.0"
edition = "2021"
description = "The official Rust SDK for ElevenLabs."
license = "MIT"
repository = "https://github.com/elevenlabs/elevenlabs-rust"
readme = "README.md"
keywords = ["sdk", "api", "rest"]
categories = ["api-bindings"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# `preserve_order`: the agent_workflows builder loads workflows preserving the document order of
# the `nodes`/`edges` objects (required for byte-identical output across SDKs). This only changes
# the key order of free-form `serde_json::Value` objects, which carry no sorted-order contract;
# the builder sorts keys explicitly when emitting canonical JSON.
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12.4", default-features = false, features = ["json", "rustls-tls", "http2", "multipart", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
thiserror = "2"
httpdate = "1"
rand = "0.9"
futures = "0.3"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
url = { version = "2", optional = true }
urlencoding = { version = "2.1", optional = true }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
# Hand-written Speech Engine server surface (see `.fernignore`): HS256 JWT verification of
# inbound Speech Engine connections. Small, pure-Rust crates; not emitted by Fern.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
# Optional axum router integration for the Speech Engine server (behind the `axum` feature).
axum = { version = "0.7", features = ["ws"], optional = true }

[dev-dependencies]
wiremock = "0.6"
[features]
default = ["websocket"]
websocket = ["tokio-tungstenite", "urlencoding", "url"]
# Mount the Speech Engine inbound server on an existing axum Router instead of running the
# bundled standalone server. Pulls in axum; off by default.
axum = ["dep:axum", "websocket"]